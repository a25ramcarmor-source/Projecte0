<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>
<body style="background-color: #f5f5dc;">

    <div class="container mt-5">

        <div class="card shadow mx-auto" style="max-width: 700px;">

            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Actualizar pregunta</h3>
            </div>

            <div class="card-body">

                <form id="formActualizar">

                    <!-- PREGUNTA -->
                    <div class="mb-4">

                        <label for="pregunta_text" class="form-label">
                            Pregunta
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="pregunta_text"
                            name="pregunta_text"
                            placeholder="Escribe la pregunta"
                            required
                        >

                    </div>


                    <!-- OPCIÓN 1 -->
                    <div class="mb-3">

                        <label class="form-label">
                            Opción 1
                        </label>

                        <div class="input-group">

                            <div class="input-group-text">
                                <input
                                    type="radio"
                                    name="correcta"
                                    value="0"
                                    title="Marcar como correcta"
                                >
                            </div>

                            <input
                                type="text"
                                class="form-control"
                                id="opcion1"
                                placeholder="Escribe la opción 1"
                            >

                        </div>

                    </div>


                    <!-- OPCIÓN 2 -->
                    <div class="mb-3">

                        <label class="form-label">
                            Opción 2
                        </label>

                        <div class="input-group">

                            <div class="input-group-text">
                                <input
                                    type="radio"
                                    name="correcta"
                                    value="1"
                                    title="Marcar como correcta"
                                >
                            </div>

                            <input
                                type="text"
                                class="form-control"
                                id="opcion2"
                                placeholder="Escribe la opción 2"
                            >

                        </div>

                    </div>


                    <!-- OPCIÓN 3 -->
                    <div class="mb-3">

                        <label class="form-label">
                            Opción 3
                        </label>

                        <div class="input-group">

                            <div class="input-group-text">
                                <input
                                    type="radio"
                                    name="correcta"
                                    value="2"
                                    title="Marcar como correcta"
                                >
                            </div>

                            <input
                                type="text"
                                class="form-control"
                                id="opcion3"
                                placeholder="Escribe la opción 3"
                            >

                        </div>

                    </div>


                    <!-- IMAGEN -->
                    <div class="mb-4">

                        <label for="imatge" class="form-label">
                            Imagen (opcional)
                        </label>

                        <input
                            type="file"
                            class="form-control"
                            id="imatge"
                            name="imatge"
                            accept="image/*"
                        >

                        <!-- Aquí aparecerá la imagen actual -->
                        <div id="imagenActual" class="mt-3"></div>

                    </div>


                    <!-- MENSAJE -->
                    <div id="mensaje"></div>


                    <!-- BOTONES -->
                    <div class="d-flex justify-content-between">

                        <a
                            href="admin.html"
                            class="btn btn-secondary"
                        >
                            Cancelar
                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Actualizar pregunta
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <script src="admin.js"></script>

</body>
</html>
